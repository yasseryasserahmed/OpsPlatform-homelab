- name: Install and configure HAProxy frontend
  hosts: ha_proxy
  become: true
  gather_facts: false

  tasks:
    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure HAProxy backends for Kubernetes workers
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: haproxy -c -f %s
      notify: Restart HAProxy

    - name: Ensure HAProxy is enabled and running
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
