name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: lab
    concurrency:
      group: terraform-lab
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/environments/lab
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_vpc_cidr }}
      TF_VAR_public_subnet_cidr: ${{ vars.TF_VAR_public_subnet_cidr }}
      TF_VAR_ami_id: ${{ vars.TF_VAR_ami_id }}
      TF_VAR_instance_type: ${{ vars.TF_VAR_instance_type }}
      TF_VAR_ha_proxy_instance_type: ${{ vars.TF_VAR_ha_proxy_instance_type }}
      TF_VAR_key_name: ${{ vars.TF_VAR_key_name }}
      TF_VAR_allowed_ssh_cidr: ${{ vars.TF_VAR_allowed_ssh_cidr }}
      TF_VAR_allowed_ingress_cidr: ${{ vars.TF_VAR_allowed_ingress_cidr }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize S3 backend
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
