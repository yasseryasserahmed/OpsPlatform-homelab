apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hello-selfsigned
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-lab-tls
  namespace: default
spec:
  secretName: hello-lab-tls
  issuerRef:
    name: hello-selfsigned
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - hello.lab
