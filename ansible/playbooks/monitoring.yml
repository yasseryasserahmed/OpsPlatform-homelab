- name: Install Prometheus and Grafana monitoring stack
  hosts: control_plane_instance
  become: true
  gather_facts: false

  vars_prompt:
    - name: grafana_admin_password
      prompt: Enter a Grafana admin password (minimum 16 characters)
      private: true
      confirm: true

  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    deployments_dir: /deployments
    monitoring_namespace_manifest: /deployments/monitoring-namespace.yml
    grafana_ingress_manifest: /deployments/grafana-ingress.yml
    grafana_secret_manifest: /run/grafana-admin-secret.yml
    monitoring_namespace: monitoring
    monitoring_release: monitoring
    monitoring_chart_version: "92.10.1"
    grafana_admin_secret: grafana-admin

  tasks:
    - name: Ensure the deployments directory exists
      ansible.builtin.file:
        path: "{{ deployments_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render the monitoring namespace manifest
      ansible.builtin.template:
        src: ../templates/monitoring-namespace.yml.j2
        dest: "{{ monitoring_namespace_manifest }}"
        owner: root
        group: root
        mode: "0644"

    - name: Apply the monitoring namespace manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - apply
          - -f
          - "{{ monitoring_namespace_manifest }}"
      register: monitoring_namespace_apply
      changed_when: "'created' in monitoring_namespace_apply.stdout or 'configured' in monitoring_namespace_apply.stdout"

    - name: Validate the Grafana admin password
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length >= 16
        fail_msg: The Grafana admin password must be at least 16 characters long.
      no_log: true

    - name: Create or update the Grafana admin Secret
      block:
        - name: Render the Grafana admin Secret manifest
          ansible.builtin.template:
            src: ../templates/grafana-admin-secret.yml.j2
            dest: "{{ grafana_secret_manifest }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Apply the Grafana admin Secret manifest
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ kubeconfig }}"
              - apply
              - -f
              - "{{ grafana_secret_manifest }}"
          register: grafana_secret_apply
          changed_when: "'created' in grafana_secret_apply.stdout or 'configured' in grafana_secret_apply.stdout"

      always:
        - name: Remove the temporary Grafana admin Secret manifest
          ansible.builtin.file:
            path: "{{ grafana_secret_manifest }}"
            state: absent

    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: "{{ monitoring_release }}"
        chart_ref: kube-prometheus-stack
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_version: "{{ monitoring_chart_version }}"
        release_namespace: "{{ monitoring_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 10m
        values:
          grafana:
            enabled: true
            admin:
              existingSecret: "{{ grafana_admin_secret }}"
              userKey: admin-user
              passwordKey: admin-password
            ingress:
              enabled: false
            persistence:
              enabled: false
            service:
              type: ClusterIP
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          prometheus:
            enabled: true
            prometheusSpec:
              retention: 7d
              retentionSize: 5GB
              storageSpec:
                emptyDir: {}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          alertmanager:
            enabled: true
          kubeStateMetrics:
            enabled: true
          nodeExporter:
            enabled: true

    - name: Copy Grafana self-signed TLS and Ingress manifest
      ansible.builtin.copy:
        src: ../../Kubernetes/grafana-ingress.yml
        dest: "{{ grafana_ingress_manifest }}"
        owner: root
        group: root
        mode: "0644"

    - name: Apply Grafana self-signed TLS and Ingress manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - apply
          - -f
          - "{{ grafana_ingress_manifest }}"
      register: grafana_ingress_apply
      changed_when: "'created' in grafana_ingress_apply.stdout or 'configured' in grafana_ingress_apply.stdout"

    - name: Wait for the Grafana TLS certificate to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - wait
          - --for=condition=Ready
          - certificate/grafana-tls
          - --namespace
          - "{{ monitoring_namespace }}"
          - --timeout=180s
      changed_when: false

    - name: Wait for monitoring pods to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - wait
          - --for=condition=Ready
          - pods
          - --all
          - --namespace
          - "{{ monitoring_namespace }}"
          - --timeout=600s
      changed_when: false

    - name: Show monitoring pods and services
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - get
          - pods,services
          - --namespace
          - "{{ monitoring_namespace }}"
          - --output
          - wide
      register: monitoring_resources
      changed_when: false

    - name: Report monitoring resources
      ansible.builtin.debug:
        msg: "{{ monitoring_resources.stdout_lines }}"
