- name: Install Argo CD and expose its UI through the F5 NGINX Ingress
  hosts: control_plane_instance
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    deployments_dir: /deployments
    argocd_namespace: argocd
    argocd_release: argocd
    argocd_chart_version: "10.10.5"
    argocd_ingress_manifest: /deployments/argocd-ingress.yml

  tasks:
    - name: Install Argo CD with the pinned Helm chart
      kubernetes.core.helm:
        name: "{{ argocd_release }}"
        chart_ref: argo-cd
        chart_repo_url: https://argoproj.github.io/argo-helm
        chart_version: "{{ argocd_chart_version }}"
        release_namespace: "{{ argocd_namespace }}"
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 10m
        values:
          configs:
            params:
              server.insecure: "true"
          server:
            ingress:
              enabled: false
            service:
              type: ClusterIP

    - name: Ensure the deployments directory exists
      ansible.builtin.file:
        path: "{{ deployments_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the Argo CD TLS and Ingress manifest
      ansible.builtin.copy:
        src: ../../Kubernetes/argocd-ingress.yml
        dest: "{{ argocd_ingress_manifest }}"
        owner: root
        group: root
        mode: "0644"

    - name: Apply the Argo CD TLS and Ingress manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - apply
          - -f
          - "{{ argocd_ingress_manifest }}"
      register: argocd_ingress_apply
      changed_when: "'created' in argocd_ingress_apply.stdout or 'configured' in argocd_ingress_apply.stdout"

    - name: Wait for the Argo CD TLS certificate to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - wait
          - --for=condition=Ready
          - certificate/argocd-tls
          - --namespace
          - "{{ argocd_namespace }}"
          - --timeout=180s
      changed_when: false

    - name: Show Argo CD pods, service, and Ingress
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig }}"
          - get
          - pods,service,ingress
          - --namespace
          - "{{ argocd_namespace }}"
          - --output
          - wide
      register: argocd_resources
      changed_when: false

    - name: Report Argo CD resources
      ansible.builtin.debug:
        msg: "{{ argocd_resources.stdout_lines }}"
