apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: grafana-selfsigned
  namespace: monitoring
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  secretName: grafana-tls
  issuerRef:
    name: grafana-selfsigned
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - grafana.lab
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.lab
      secretName: grafana-tls
  rules:
    - host: grafana.lab # Replace with your desired domain name
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80