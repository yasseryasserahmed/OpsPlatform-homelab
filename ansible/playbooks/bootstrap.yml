---
- name: Bootstrap the lab control-plane host
  hosts: control_plane_instance
  become: true
  gather_facts: true

  tasks:
    - name: Refresh apt package metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline tools
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present